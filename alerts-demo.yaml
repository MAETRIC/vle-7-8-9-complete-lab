apiVersion: v1
kind: Pod
metadata:
  name: controlled-crash
  namespace: vle7
  labels: {lab-test: 'true'}
spec:
  restartPolicy: Always
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 1000}
  containers:
    - name: controlled-crash
      image: vle-clinic:1
      imagePullPolicy: Never
      command: [node, -e, 'console.log("Controlled failure for Experiment 7 alert test");process.exit(1)']
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
---
apiVersion: v1
kind: Pod
metadata:
  name: controlled-cpu-load
  namespace: vle7
  labels: {lab-test: 'true'}
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 1000}
  containers:
    - name: controlled-cpu-load
      image: vle-clinic:1
      imagePullPolicy: Never
      command: [node, -e, 'const end=Date.now()+300000;while(Date.now()<end){Math.sqrt(Math.random());}console.log("Controlled CPU load completed")']
      resources:
        requests: {cpu: 100m, memory: 32Mi}
        limits: {cpu: 600m, memory: 64Mi}
